[build]
builder = "RAILPACK"
watchPatterns = [
  "/api_server.py",
  "/pyproject.toml",
  "/railway.toml",
  "/requirements.txt",
  "/src/**"
]

[deploy]
startCommand = "uvicorn api_server:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/ready"
healthcheckTimeout = 900
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
