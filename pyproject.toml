[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainlens"
version = "0.1.0"
description = "面向智能制造数据要素场景的可审计产业分析平台"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "langgraph>=0.2",
    "openai>=1.50",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow>=15",
    "reportlab>=4.0",
    "sqlparse>=0.5",
    "xlrd>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
